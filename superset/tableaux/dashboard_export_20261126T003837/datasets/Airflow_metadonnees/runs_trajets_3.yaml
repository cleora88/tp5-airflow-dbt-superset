table_name: runs_trajets
main_dttm_col: debut
currency_code_column: null
description: "Produit trajets quotidiens \u2014 Direction des op\xE9rations. D\xE9\
  finitions dans dbt."
default_endpoint: null
offset: 0
cache_timeout: 3600
catalog: null
schema: null
sql: SELECT r.run_id,r.run_type,r.state,to_char(r.logical_date,'YYYY-MM-DD') AS jour_traite,min(t.start_date)
  AS debut,EXTRACT(EPOCH FROM max(t.end_date)-min(t.start_date)) AS duree_s,count(*)
  FILTER(WHERE t.state IN ('failed','upstream_failed')) AS taches_ko FROM dag_run
  r JOIN task_instance t ON t.dag_id=r.dag_id AND t.run_id=r.run_id WHERE r.dag_id='trajets_quotidien'
  AND r.end_date IS NOT NULL GROUP BY r.run_id,r.run_type,r.state,r.logical_date
