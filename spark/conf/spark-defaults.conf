# Accès à MinIO par le protocole S3A
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.access.key               minioadmin
spark.hadoop.fs.s3a.secret.key               minioadmin
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false

# Catalogue Iceberg « lake » : le même Hive Metastore, interrogé par son API REST Iceberg
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                  rest
spark.sql.catalog.lake.uri                   http://hive-metastore:9181/iceberg
spark.sql.catalog.lake.io-impl               org.apache.iceberg.hadoop.HadoopFileIO

# Afficher le nom des colonnes dans le shell spark-sql
spark.hadoop.hive.cli.print.header           true

# Jeu de donnees local : limiter les taches et exposer la Spark UI.
spark.ui.bindAddress                       0.0.0.0
# TP4 : le pilote (driver) tourne dans le conteneur spark ; les exécuteurs l'y joignent

# TP4 : chaque application écrit le journal de ses événements pour le History Server
spark.sql.shuffle.partitions 200
spark.driver.host airflow
spark.driver.memory 512m
spark.sql.shuffle.partitions 8
