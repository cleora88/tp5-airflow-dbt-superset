# Catalogue « lake » de Trino : les tables Iceberg de Spark, par le même Hive Metastore
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://hive-metastore:9181/iceberg
# Lire et écrire les fichiers dans MinIO
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
